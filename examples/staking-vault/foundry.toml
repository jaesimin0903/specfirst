[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

# Fuzz parameters are CLI inputs in specfirst (injected as FOUNDRY_INVARIANT_*); these are the local defaults.
[invariant]
runs = 256
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
